name: CI

# Sur chaque pull request du core : un échec bloque la fusion
# (à activer dans GitHub : Settings > Branches > règle sur main, statuts « qualité », « base de données », « site » requis).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    name: base de données
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client libtap-parser-sourcehandler-pgtap-perl
      # Démarre uniquement Postgres de Supabase et applique les migrations de packages/db.
      - run: supabase db start
        working-directory: packages/db
      - run: bash tools/scripts/test-db.sh

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build du site de démonstration et du Worker
        run: pnpm turbo run build:worker --filter=@lp/site
      - name: Taille du Worker
        run: pnpm worker:size
      - run: pnpm --filter @lp/site exec playwright install --with-deps chromium
      - name: Tests de bout en bout sur le Worker (runtime Cloudflare local)
        run: pnpm --filter @lp/site test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/site/playwright-report
