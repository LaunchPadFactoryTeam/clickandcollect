name: CI

# Sur chaque pull request du core : un échec bloque la fusion
# (à activer dans GitHub : Settings > Branches > règle sur main, statuts « qualité », « base de données », « site » requis).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    name: base de données
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      LP_SUPABASE_URL: http://127.0.0.1:54321
      LP_SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Secret JWT HS256 par défaut de la pile Supabase locale (pas un secret de production).
      LP_SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client libtap-parser-sourcehandler-pgtap-perl
      # Postgres, passerelle et PostgREST seulement ; migrations et données de démonstration appliquées au démarrage.
      - run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
        working-directory: packages/db
      - name: Tests pgTAP et numérotation concurrente
        run: bash tools/scripts/test-db.sh
      - name: Tests d'intégration via l'API (jeton de site)
        run: pnpm --filter @launchpadfactoryteam/db exec vitest run
      - name: Types générés à jour
        run: pnpm --filter @launchpadfactoryteam/db types && git diff --exit-code packages/db/src/database.types.ts

  site:
    name: site (${{ matrix.exemple }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Un exemple par template : A éditorial, B immersif, C chaleureux.
        exemple: [maison-ferrand, noir-et-sel, comptoir-saint-roch]
    env:
      LP_SITE_DIR: ../../examples/${{ matrix.exemple }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build du site et du Worker
        run: pnpm turbo run build:worker --filter=@launchpadfactoryteam/site
      - name: Taille du Worker
        run: pnpm worker:size
      - run: pnpm --filter @launchpadfactoryteam/site exec playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité sur le Worker (runtime Cloudflare local)
        run: pnpm --filter @launchpadfactoryteam/site test:e2e
        env:
          CI: "true"
      - name: Budgets de performance (Lighthouse)
        run: pnpm --filter @launchpadfactoryteam/site test:perf
      - name: Captures de référence (revue visuelle)
        if: always()
        run: |
          pnpm --filter @launchpadfactoryteam/site exec opennextjs-cloudflare preview --port 3100 > /tmp/preview.log 2>&1 &
          npx --yes wait-on -t 180000 http://localhost:3100/
          pnpm --filter @launchpadfactoryteam/site test:visual http://localhost:3100 captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.exemple }}
          path: |
            apps/site/playwright-report
            apps/site/.lighthouseci
            apps/site/captures
          if-no-files-found: ignore

  tunnel:
    name: tunnel de paiement
    runs-on: ubuntu-latest
    env:
      E2E_TUNNEL: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Base locale avec la boutique de démonstration (seed) ; le site s'y connecte avec un jeton de site.
      - run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
        working-directory: packages/db
      - name: Variables du Worker (faux fournisseur de paiement, base locale, Supabase Auth)
        run: |
          export SUPABASE_ANON_KEY="$(supabase status -o env | sed -n 's/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          node ../../tools/scripts/dev-vars.mjs
        working-directory: packages/db
      - name: Build du site de démonstration et du Worker
        run: pnpm turbo run build:worker --filter=@launchpadfactoryteam/site
      - run: pnpm --filter @launchpadfactoryteam/site exec playwright install --with-deps chromium
      - name: Tunnel complet de bout en bout (panier, paiement, webhook, confirmation, emails, back-office)
        run: pnpm --filter @launchpadfactoryteam/site test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tunnel-playwright-report
          path: apps/site/playwright-report
